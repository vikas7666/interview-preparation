<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>array delete</title>
</head>
<body>
    <script>
         let data = [30,20,45,76,20,80];
         let position = 3
         for(let i= position; i<data.length- 1; i++){
           data[i] = data[i+1]
         }
         data.length = data.length-1;
         console.log('data',data)
    </script>
</body>
</html>
