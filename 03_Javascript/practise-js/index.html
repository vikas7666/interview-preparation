<script>
    let array1 = [2, 3, 5, 6, 8]

    function customMap(array, callback) {
        let total = [];

        for (let i = 0; i < array.length; i++) {
            total.push(callback(array[i], i, array));
        }

        return total;
    }

    function addItem(item) {
        return item * 2
    }
    function arryMinus1(item) {
        return item * 2
    }

    const myFunc = customMap(array1, addItem)
